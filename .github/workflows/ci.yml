name: VidPulse AI Analytics CI

on:
  push:
    branches: [ main, 'chore/**', 'feat/**', 'fix/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Video Analytics Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest numpy pydantic pydantic-settings opencv-python-headless aiofiles

      - name: Run Analytics Unit Tests
        run: pytest backend/tests/ -v
