services:
  - type: web
    name: vidpulse-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        value: ed122a18b3fff1a74637b9dee70c9da3abfdd4b867938014b8947fa07b3fef97
      - key: NODE_ENV
        value: production
      - key: DEVICE
        value: cpu
      - key: FRAMES_PER_SECOND
        value: "1"
      - key: ATTENTION_THRESHOLD
        value: "0.45"
      - key: DATABASE_URL
        fromDatabase:
          name: vidpulse-db
          property: connectionString
    healthCheckPath: /health

databases:
  - name: vidpulse-db
    databaseName: vidpulse
    user: vidpulse
    plan: free
